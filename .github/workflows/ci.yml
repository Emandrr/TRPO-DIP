name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore SaEkg.sln
      - name: Build
        run: dotnet build SaEkg.sln -c Release --no-restore
      - name: Test
        run: dotnet test SaEkg.sln -c Release --no-build --verbosity normal
      - name: OpenAPI artifact
        if: always()
        run: |
          if [ -f ../openapi.json ]; then
            echo "openapi.json present"
          else
            echo "openapi.json will be produced by OpenApiExportTests when Docker is available"
          fi
      - name: Vulnerable packages
        run: |
          set +e
          dotnet list package --vulnerable --include-transitive
          code=$?
          set -e
          if [ $code -ne 0 ]; then exit $code; fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Unit tests (validators)
        run: npx --yes tsx --test src/app/shared/validators/med.validators.node-test.ts
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high || true

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder for compose e2e job
        run: echo "Enable when Docker Compose services are wired in CI"
