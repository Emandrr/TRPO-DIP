<h2>{{ t.ecgTitle }}</h2>

@if (loading() && records().length === 0) {
  <p>…</p>
} @else if (records().length === 0) {
  <mat-card><mat-card-content>{{ t.noEcg }}</mat-card-content></mat-card>
} @else {
  <table mat-table [dataSource]="records()" class="table">
    <ng-container matColumnDef="filename">
      <th mat-header-cell *matHeaderCellDef>{{ t.filename }}</th>
      <td mat-cell *matCellDef="let row">{{ row.originalFilename }}</td>
    </ng-container>
    <ng-container matColumnDef="uploadedAt">
      <th mat-header-cell *matHeaderCellDef>{{ t.uploadedAt }}</th>
      <td mat-cell *matCellDef="let row">{{ row.uploadedAt | date: 'dd.MM.yyyy HH:mm' }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>{{ t.status }}</th>
      <td mat-cell *matCellDef="let row">{{ row.status }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <a mat-button color="primary" [routerLink]="['/doctor/patients', row.patientId, 'ecg', row.id]">
          {{ t.openRecord }}
        </a>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
}
