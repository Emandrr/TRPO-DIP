services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saekg
      POSTGRES_PASSWORD: saekg
      POSTGRES_DB: saekg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saekg -d saekg"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=saekg;Username=saekg;Password=saekg
      DuckDb__Path: /data/ecg.duckdb
    ports:
      - "8080:8080"
    volumes:
      - duckdb_data:/data
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "4200:80"
    volumes:
      - ../frontend/dist/sa-ekg-web/browser:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: saekg
      POSTGRES_PASSWORD: saekg
      POSTGRES_DB: saekg
      DUCKDB_PATH: /data/ecg.duckdb
      BACKUP_ROOT: /backups
      BACKUP_KEEP: "14"
    volumes:
      - duckdb_data:/data:ro
      - backups:/backups
      - ./backup.sh:/backup.sh:ro
      - ./restore.sh:/restore.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/backup.sh"]
    restart: "no"

volumes:
  postgres_data:
  duckdb_data:
  backups:
